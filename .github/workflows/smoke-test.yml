name: Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy environment file
        run: cp .env.example .env

      - name: Validate Compose file
        run: docker compose config > /dev/null

      - name: Build and start stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Check public health endpoints
        run: |
          curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:3000/ > /dev/null
          curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:3005/health > /dev/null
          curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:3001/ > /dev/null

      - name: Tear down stack
        if: always()
        run: docker compose down
