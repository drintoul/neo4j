services:
  neo4j:
    image: neo4j:5.25-community
    container_name: neo4j-db
    restart: unless-stopped
    ports:
      - "${NEO4J_BROWSER_HOST}:${NEO4J_BROWSER_PORT}:7474"
      - "${NEO4J_BOLT_HOST}:${NEO4J_BOLT_PORT}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=${NEO4J_HEAP_SIZE}
      - NEO4J_dbms_memory_heap_max__size=${NEO4J_HEAP_SIZE}
      - NEO4J_dbms_default__listen__address=0.0.0.0
      - NEO4J_dbms_connector_bolt_advertised__address=${NEO4J_BOLT_HOST}:${NEO4J_BOLT_PORT}
    volumes:
      - ./data/neo4j:/data
      - ./logs/neo4j:/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${NEO4J_MEMORY_LIMIT}
    networks:
      - neo4j-network

  llm-proxy:
    build:
      context: ./llm-proxy
      dockerfile: Dockerfile
    container_name: neo4j-llm-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LLM_PROXY_PUBLISHED_PORT}:3002"
    environment:
      - PORT=3002
      - OLLAMA_HOST=${OLLAMA_HOST}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - neo4j-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: neo4j-ui
    restart: unless-stopped
    ports:
      - "${UI_HOST}:${UI_PORT}:8080"
    environment:
      - NEO4J_URI=${NEO4J_UI_URI}
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - neo4j-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: neo4j-mcp
    restart: unless-stopped
    ports:
      - "${MCP_HOST}:${MCP_PUBLISHED_PORT}:3001"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - MCP_PORT=3001
      - MCP_MAX_RECORDS=${MCP_MAX_RECORDS}
      - MCP_QUERY_TIMEOUT_MS=${MCP_QUERY_TIMEOUT_MS}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - neo4j-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  neo4j-network:
    driver: bridge
